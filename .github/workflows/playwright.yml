name: Playwright wizard screenshot
'on':
  # Same set-up as firebase-hosting-pull-request.yml: branches in this repository run on `pull_request`,
  # forks on `pull_request_target` after a reviewer approves the preview-external environment.
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  # The event name keeps the skipped run of one event from cancelling the real run of the other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Runs the pull request's code with a read-only token. Pushing the screenshot and commenting happen in
  # `publish`, which never runs code from the pull request.
  screenshot:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    environment: ${{ github.event_name == 'pull_request_target' && 'preview-external' || 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out'
        uses: actions/checkout@v4
        with:
          # The commit that was approved, not whatever the branch points at by the time the job starts.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: 'Install node'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: 'Load dependencies'
        run: yarn
      - name: 'Install Playwright browsers'
        run: npx playwright install --with-deps chromium
      - name: 'Click through the wizard and screenshot it'
        run: yarn test-e2e
        env:
          VITE_GOOGLE_MAPS_KEY: '${{ secrets.GOOGLE_MAPS_KEY }}'
      - name: 'Upload screenshot'
        uses: actions/upload-artifact@v4
        with:
          name: wizard-screenshot
          path: e2e/screenshots/wizard.png
          if-no-files-found: error
      - name: 'Upload Playwright report'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  publish:
    needs: screenshot
    if: always() && (needs.screenshot.result == 'success' || needs.screenshot.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Check out'
        # On pull_request_target this is main, never the fork's code.
        if: needs.screenshot.result == 'success'
        uses: actions/checkout@v4
      - name: 'Download screenshot'
        if: needs.screenshot.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wizard-screenshot
          path: ${{ runner.temp }}/screenshot
      - name: 'Publish screenshot to the pr-screenshots branch'
        if: needs.screenshot.result == 'success'
        id: publish
        env:
          SCREENSHOT: ${{ runner.temp }}/screenshot/wizard.png
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          screenshot_path="pr-${{ github.event.pull_request.number }}/wizard.png"

          git fetch origin pr-screenshots 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/pr-screenshots; then
            git checkout -b pr-screenshots origin/pr-screenshots
          else
            git checkout --orphan pr-screenshots
            # --orphan carries the source branch's index over; drop it so we don't commit the
            # whole app tree.
            git rm -rf --cached . > /dev/null
          fi

          mkdir -p "pr-${{ github.event.pull_request.number }}"
          cp "$SCREENSHOT" "$screenshot_path"
          git add "$screenshot_path"
          git commit -m "Update wizard screenshot for PR #${{ github.event.pull_request.number }}" --allow-empty
          git push origin pr-screenshots

          echo "path=$screenshot_path" >> "$GITHUB_OUTPUT"
      - name: 'Comment on the pull request'
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- playwright-wizard-screenshot -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            let body
            if ('${{ steps.publish.outcome }}' === 'success') {
              // Cache-bust with the run id so the image updates on every push, since the path is
              // reused across runs for the same PR.
              const imageUrl = `${context.serverUrl.replace('github.com', 'raw.githubusercontent.com')}/${context.repo.owner}/${context.repo.repo}/pr-screenshots/${{ steps.publish.outputs.path }}?run=${context.runId}`
              body = `${marker}\n📸 Wizard screenshot:\n\n![Wizard screenshot](${imageUrl})\n\n[View run](${runUrl})`
            } else {
              body = `${marker}\n📸 The wizard screenshot test failed. [View run](${runUrl}) for details.`
            }

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            })
            const existing = comments.find((c) => c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
